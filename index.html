// 状態管理＆ローカルストレージ復帰

const STORAGE_KEY = "wordocchi_session_v1";
let myId = "";
let myName = "";
let currentRoomId = "";
let roomRef = null;
let roomData = null;
let lastMsgCount = 0;

function generatePlayerId() {
return "p_" + Math.random().toString(36).substring(2, 10);
}

function saveSession(roomId, playerId, name) {
localStorage.setItem(STORAGE_KEY, JSON.stringify({ roomId, playerId, name}));
}

function clearSavedSession() {
localStorage.removeItem(STORAGE_KEY);
document.getElementById("resume-banner").classList.add("hidden");
}

window.addEventListener("DOMContentLoaded", () => {
const roomParam = new URLSearchParams(location.search).get("room");
if (roomParam && /^\d{4}$/.test(roomParam)) {
document.getElementById("input-room-id").value = roomParam;
}
const saved = localStorage.getItem(STORAGE_KEY);
if (saved) {
try {
const data = JSON.parse(saved);
if (data.roomId && data.playerId && data.name) {
document.getElementById("input-name").value = data.name;
document.getElementById("resume-info").textContent = `ルームID: ${data.roomId}（名前: ${data.name}）`;
document.getElementById("resume-banner").classList.remove("hidden");
}
} catch (e) {
clearSavedSession();
}
}
});

async function resumeRoom() {
const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
if (!saved) return;
const snap = await db.ref(`rooms/${saved.roomId}`).once("value");
if (!snap.exists()) {
alert("そのルームは既に終了しているようです。新しく作成してください！");
clearSavedSession();
return;
}
myId = saved.playerId;
myName = saved.name;
enterRoom(saved.roomId);
}

async function createRoom() {
const name = document.getElementById("input-name").value.trim();
if (!name) return alert("ニックネームを入力してね！");

let roomId = "";
for (let i = 0; i < 10; i++) {
const candidate = Math.floor(1000 + Math.random() * 9000).toString();
const snap = await db.ref(`rooms/${candidate}`).once("value");
if (!snap.exists()) {
roomId = candidate;
break;
}
}
if (!roomId) return alert("部屋の生成に失敗しました。もう一度お試しください。");

myId = generatePlayerId();
myName = name;

const initialData = {
createdAt: Date.now(),
phase: "waiting",
parentId: "",
criterion: "",
initialWords: [],
championWord: "",
championAuthor: "",
pendingWord: null,
usedCriteria: [],
usedWordSets: [],
finalSubmissions: {},
winnerId: "",
players: {
[myId]: { name: myName, score: 0, joinedAt: Date.now()}
},
messages: {
msg_0: {
type: "system",
text: `ルームが作成されました！誰か1人が「親になる」を押してスタートしよう！`,
ts: Date.now()
}
}
};

await db.ref(`rooms/${roomId}`).set(initialData);
saveSession(roomId, myId, myName);
enterRoom(roomId);
}

async function joinRoom() {
const name = document.getElementById("input-name").value.trim();
const roomId = document.getElementById("input-room-id").value.trim();
if (!name) return alert("ニックネームを入力してね！");
if (!/^\d{4}$/.test(roomId)) return alert("4桁の数字IDを入力してね！");

const snap = await db.ref(`rooms/${roomId}`).once("value");
if (!snap.exists()) return alert("そのルームIDは見つかりませんでした！");

const saved = localStorage.getItem(STORAGE_KEY);
if (saved) {
const parsed = JSON.parse(saved);
if (parsed.roomId === roomId && parsed.playerId) {
myId = parsed.playerId;
}
}
if (!myId) myId = generatePlayerId();
myName = name;

const existingPlayer = snap.val().players && snap.val().players[myId];
if (!existingPlayer) {
await db.ref(`rooms/${roomId}/players/${myId}`).set({
name: myName,
score: 0,
joinedAt: Date.now()
});
await pushSystemMessage(roomId, `👋 ${myName} さんが入室しました！`);
} else {
await db.ref(`rooms/${roomId}/players/${myId}/name`).set(myName);
}

saveSession(roomId, myId, myName);
enterRoom(roomId);
}

function enterRoom(roomId) {
currentRoomId = roomId;
document.getElementById("lobby-screen").classList.add("hidden");
document.getElementById("game-screen").classList.remove("hidden");
document.getElementById("header-room-id").textContent = roomId;

if (roomRef) roomRef.off();
roomRef = db.ref(`rooms/${roomId}`);
roomRef.on("value", (snap) => {
if (!snap.exists()) {
alert("ルームが解散されました。");
leaveRoom(true);
return;
}
roomData = snap.val();
renderAll();
});
}

function leaveRoom(skipConfirm = false) {
if (!skipConfirm &&!confirm("ルームから退室しますか？（同じIDを入れればまた戻れます）")) return;
if (roomRef) roomRef.off();
clearSavedSession();
currentRoomId = "";
roomData = null;
lastMsgCount = 0;
document.getElementById("game-screen").classList.add("hidden");
document.getElementById("lobby-screen").classList.remove("hidden");
}

function copyRoomId() {
navigator.clipboard.writeText(currentRoomId);
alert(`ルームID「${currentRoomId}」をコピーしました！`);
}

async function shareInvite() {
const url = `${location.origin}${location.pathname}?room=${currentRoomId}`;
const text = `ワードッチ！一緒に遊ぼう🎉\nルームID：${currentRoomId}\nリンクを開くとIDが自動で入るよ。そのまま名前を入れて「入室する」を押してね！\n${url}`;
if (navigator.share) {
try {
await navigator.share({ title: "ワードッチ！", text });
} catch (e) {
// 共有をキャンセルした場合は何もしない
}
} else {
navigator.clipboard.writeText(text);
alert("招待文をコピーしました！LINEなどで送ってね");
}
}

function pickRandomUnused(list, usedIndices = []) {
let available = list.map((_, idx) => idx).filter(idx =>!usedIndices.includes(idx));
if (available.length === 0) {
available = list.map((_, idx) => idx);
usedIndices = [];
}
const chosenIdx = available[Math.floor(Math.random() * available.length)];
return { item: list[chosenIdx], index: chosenIdx, reset: available.length === list.length};
}

async function becomeParent() {
const usedC = roomData.usedCriteria || [];
const usedW = roomData.usedWordSets || [];

const cPick = pickRandomUnused(CRITERIA_LIST, usedC);
const wPick = pickRandomUnused(WORD_SETS, usedW);

const nextUsedC = cPick.reset? [cPick.index]: [...usedC, cPick.index];
const nextUsedW = wPick.reset? [wPick.index]: [...usedW, wPick.index];

await roomRef.update({
phase: "initial_pick",
parentId: myId,
criterion: cPick.item,
initialWords: wPick.item,
championWord: "",
championAuthor: "",
pendingWord: null,
finalSubmissions: {},
winnerId: "",
usedCriteria: nextUsedC,
usedWordSets: nextUsedW
});

await pushSystemMessage(currentRoomId, `👑 ${myName} さんが今回のになりました！最初の3択を選んでいます…`);
}

async function rerollCriterion() {
const usedC = roomData.usedCriteria || [];
const cPick = pickRandomUnused(CRITERIA_LIST, usedC);
const nextUsedC = cPick.reset? [cPick.index]: [...usedC, cPick.index];
await roomRef.update({
criterion: cPick.item,
usedCriteria: nextUsedC
});
}

async function setCustomCriterion() {
const custom = prompt("自分で考えた「基準（お題）」を入力してください：", roomData.criterion);
if (custom && custom.trim()) {
await roomRef.update({ criterion: custom.trim()});
}
}

async function selectInitialWord(word) {
await roomRef.update({
phase: "playing",
championWord: word,
championAuthor: "初期カード"
});
await pushSystemMessage(
currentRoomId,
`🃏 初期カードから、暫定1位は「${word}」に決まりました！\n子はどんどん単語を送ってね！`
);
}

async function sendCandidateWord() {
const input = document.getElementById("word-input");
if (!input) return;
const text = input.value.trim();
if (!text) return;
if (roomData.pendingWord) return alert("親が前の単語を判定中です！");

input.value = "";
const msgKey = db.ref().push().key;

await roomRef.update({
pendingWord: {
id: msgKey,
text: text,
authorId: myId,
authorName: myName
}
});

await db.ref(`rooms/${currentRoomId}/messages/${msgKey}`).set({
type: "candidate",
text: text,
authorId: myId,
authorName: myName,
ts: Date.now()
});
}

async function judgeWord(challengerWins) {
const pending = roomData.pendingWord;
if (!pending) return;

const prevChamp = roomData.championWord;
if (challengerWins) {
await roomRef.update({
championWord: pending.text,
championAuthor: pending.authorName,
pendingWord: null
});
await pushSystemMessage(
currentRoomId,
`🔥 暫定1位更新！が「${prevChamp}」に勝利！（提案：${pending.authorName}）`
);
} else {
await roomRef.update({
pendingWord: null
});
await pushSystemMessage(
currentRoomId,
`🛡️ 防衛！暫定1位の勝ち！（敗退：${pending.text}）`
);
}
}

async function startShowdown() {
if (roomData.pendingWord) {
return alert("先に今出ている単語の「どっち？」を決めてね！");
}
await roomRef.update({
phase: "showdown",
finalSubmissions: {}
});
await pushSystemMessage(
currentRoomId,
`🔔 に突入しました！\n子は「この基準で1位になる！」と思う最終ワードを1つ送信してください！`
);
}

async function submitFinalWord() {
const input = document.getElementById("final-input");
if (!input) return;
const text = input.value.trim();
if (!text) return;

await db.ref(`rooms/${currentRoomId}/finalSubmissions/${myId}`).set({
name: myName,
text: text,
ts: Date.now()
});
await pushSystemMessage(currentRoomId, `📩 ${myName} さんが最終ワードをセットしました！`);
}

async function selectShowdownWinner(winnerPlayerId) {
const subs = roomData.finalSubmissions || {};
const winSub = subs[winnerPlayerId];
if (!winSub) return;

const currentScore = (roomData.players[winnerPlayerId]?.score || 0) + 1;
await roomRef.update({
phase: "reveal",
winnerId: winnerPlayerId,
[`players/${winnerPlayerId}/score`]: currentScore
});

await pushSystemMessage(
currentRoomId,
`🏆 決戦の勝者は ${winSub.name} さんの！（+1pt）\nさあ、気になる「基準」を公開しよう！`
);
}

async function revealCriterion() {
await pushSystemMessage(
currentRoomId,
`👀 正解の基準は……\n『 ${roomData.criterion} 』でした！！`
);
await roomRef.update({
phase: "waiting",
parentId: ""
});
}

async function pushSystemMessage(roomId, text) {
const key = db.ref().push().key;
await db.ref(`rooms/${roomId}/messages/${key}`).set({
type: "system",
text: text,
ts: Date.now()
});
}

    // =========================================================================
    // 画面描画ロジック
    // =========================================================================
    function renderAll() {
      if (!roomData) return;
      const players = roomData.players || {};
      const playerIds = Object.keys(players);
      const isParent = roomData.parentId === myId;

      document.getElementById("header-player-count").textContent = `👥 ${playerIds.length}人`;
      const playersBar = document.getElementById("players-bar");
      playersBar.innerHTML = playerIds.map(pid => {
        const p = players[pid];
        const isP = pid === roomData.parentId;
        const isMe = pid === myId;
        return `
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full shrink-0 font-bold ${
            isP ? "bg-amber-400 text-slate-900" : isMe ? "bg-indigo-100 text-indigo-800" : "bg-white text-slate-700 border border-slate-200"
          }">
            ${isP ? "👑" : ""}${escapeHtml(p.name)}
            <span class="text-[10px] opacity-75">(${p.score || 0}pt)</span>
          </span>
        `;
      }).join("");

      const statusPanel = document.getElementById("status-panel");
      if (roomData.phase === "waiting") {
        statusPanel.innerHTML = `
          <div class="text-center py-1">
            <p class="text-xs font-bold text-slate-500">次のラウンドの準備中</p>
            <p class="text-sm font-black text-slate-800 mt-0.5">下のボタンから「親」を決めてスタート！</p>
          </div>
        `;
      } else {
        const parentName = players[roomData.parentId]?.name || "親";
        let html = `
          <div class="flex items-center justify-between text-xs">
            <span class="font-bold text-amber-800">👑 今回の親：${escapeHtml(parentName)}</span>
            <span class="px-2 py-0.5 rounded bg-amber-200/70 text-amber-900 font-bold">
              ${roomData.phase === "initial_pick" ? "初期3択中" : roomData.phase === "playing" ? "2択バトル中" : roomData.phase === "showdown" ? "決戦フェイズ" : "結果発表"}
            </span>
          </div>
        `;

        if (isParent) {
          html += `
            <div class="bg-slate-900 text-white rounded-xl p-3 shadow-inner space-y-1.5">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-bold bg-amber-400 text-slate-900 px-2 py-0.5 rounded">あなただけに見える基準</span>
                ${roomData.phase === "initial_pick" ? `
                  <div class="flex gap-1.5">
                    <button onclick="rerollCriterion()" class="text-[11px] bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded">🔄 引き直す</button>
                    <button onclick="setCustomCriterion()" class="text-[11px] bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded">✏️ 自作</button>
                  </div>
                ` : ""}
              </div>
              <p class="text-sm sm:text-base font-black text-amber-300 leading-snug">${escapeHtml(roomData.criterion)}</p>
            </div>
          `;
        } else {
          html += `
            <div class="bg-white/80 border border-amber-200 rounded-xl px-3 py-2 text-center">
              <span class="text-xs font-bold text-slate-500">🔒 基準（お題）：</span>
              <span class="text-xs font-black text-slate-700">親の選び方から推理しよう！</span>
            </div>
          `;
        }

        if (roomData.championWord) {
          html += `
            <div class="flex items-center justify-between bg-amber-400/20 border-2 border-amber-400 rounded-xl px-3.5 py-2">
              <div>
                <span class="text-[10px] font-black text-amber-800 block">👑 現在の暫定1位</span>
                <span class="text-lg font-black text-slate-900">${escapeHtml(roomData.championWord)}</span>
              </div>
              <span class="text-[11px] font-bold text-slate-500">by ${escapeHtml(roomData.championAuthor)}</span>
            </div>
          `;
        }
        statusPanel.innerHTML = html;
      }

      const chatContainer = document.getElementById("chat-container");
      const msgsObj = roomData.messages || {};
      const msgKeys = Object.keys(msgsObj);
      const shouldScroll = msgKeys.length !== lastMsgCount;
      lastMsgCount = msgKeys.length;

      chatContainer.innerHTML = msgKeys.map(k => {
        const m = msgsObj[k];
        if (m.type === "system") {
          return `
            <div class="flex justify-center animate-pop">
              <div class="bg-slate-700/85 text-white text-xs font-bold px-4 py-2 rounded-2xl max-w-[90%] text-center whitespace-pre-line shadow-sm leading-relaxed">
                ${escapeHtml(m.text)}
              </div>
            </div>
          `;
        } else {
          const isMine = m.authorId === myId;
          return `
            <div class="flex flex-col ${isMine ? "items-end" : "items-start"} animate-pop">
              <span class="text-[10px] font-bold text-slate-500 mb-0.5 px-1">${escapeHtml(m.authorName)}</span>
              <div class="px-4 py-2.5 rounded-2xl max-w-[80%] shadow-sm font-black text-base ${
                isMine ? "bg-indigo-600 text-white rounded-tr-sm" : "bg-white text-slate-800 rounded-tl-sm border border-slate-200"
              }">
                ${escapeHtml(m.text)}
              </div>
            </div>
          `;
        }
      }).join("");

      if (shouldScroll) {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      renderBottomPanel(isParent, playerIds);
    }

    function renderBottomPanel(isParent, playerIds) {
      const bottom = document.getElementById("bottom-panel");

      if (roomData.phase === "waiting") {
        bottom.innerHTML = `
          <button onclick="becomeParent()" class="w-full bg-amber-400 hover:bg-amber-500 active:scale-[0.99] text-slate-900 font-black py-3.5 rounded-2xl shadow-md transition text-base">
            👑 自分が「親」になって始める
          </button>
        `;
        return;
      }

      if (roomData.phase === "initial_pick") {
        if (isParent) {
          const words = roomData.initialWords || [];
          bottom.innerHTML = `
            <div class="space-y-2">
              <p class="text-xs font-black text-center text-slate-600">基準に一番近いと思う最初の1つをタップ！</p>
              <div class="grid grid-cols-3 gap-2">
                ${words.map(w => `
                  <button onclick="selectInitialWord('${escapeHtml(w)}')" class="bg-amber-100 hover:bg-amber-300 active:scale-95 border-2 border-amber-400 text-slate-900 font-black py-3 px-2 rounded-xl text-sm shadow-sm transition break-words">
                    ${escapeHtml(w)}
                  </button>
                `).join("")}
              </div>
            </div>
          `;
        } else {
          bottom.innerHTML = `
            <div class="text-center py-3 text-xs font-bold text-slate-500">
              ⏳ 親が最初の3択カードから「暫定1位」を選んでいます…
            </div>
          `;
        }
        return;
      }

      if (roomData.phase === "playing") {
        if (isParent) {
          const pending = roomData.pendingWord;
          if (pending) {
            bottom.innerHTML = `
              <div class="space-y-2.5 animate-pop">
                <p class="text-xs font-black text-center text-indigo-700">⚡ ${escapeHtml(pending.authorName)} からの挑戦！どっちが基準に近い？</p>
                <div class="grid grid-cols-2 gap-2.5">
                  <button onclick="judgeWord(false)" class="bg-amber-100 hover:bg-amber-200 active:scale-95 border-2 border-amber-500 p-3 rounded-2xl text-center shadow">
                    <span class="block text-[10px] font-black text-amber-800">👑 暫定1位（防衛）</span>
                    <span class="block text-base font-black text-slate-900 mt-0.5 break-words">${escapeHtml(roomData.championWord)}</span>
                  </button>
                  <button onclick="judgeWord(true)" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 border-2 border-indigo-700 p-3 rounded-2xl text-center shadow text-white">
                    <span class="block text-[10px] font-black text-indigo-200">🆕 挑戦者（交代）</span>
                    <span class="block text-base font-black mt-0.5 break-words">${escapeHtml(pending.text)}</span>
                  </button>
                </div>
              </div>
            `;
          } else {
            bottom.innerHTML = `
              <div class="flex items-center justify-between gap-3">
                <p class="text-xs font-bold text-slate-500 flex-1">💬 子の単語入力を待っています…</p>
                <button onclick="startShowdown()" class="bg-rose-500 hover:bg-rose-600 text-white font-black px-4 py-3 rounded-xl text-xs shadow transition shrink-0">
                  🔔 決戦フェイズへ！
                </button>
              </div>
            `;
          }
        } else {
          const isLocked = !!roomData.pendingWord;
          bottom.innerHTML = `
            <form onsubmit="event.preventDefault(); sendCandidateWord();" class="flex gap-2">
              <input id="word-input" type="text" maxlength="25" ${isLocked ? "disabled" : ""}
                placeholder="${isLocked ? "親が判定中..." : "単語を入力して送信！"}"
                class="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-base disabled:bg-slate-100 select-text" />
              <button type="submit" ${isLocked ? "disabled" : ""}
                class="bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-black px-5 py-3 rounded-xl shadow transition shrink-0">
                送信
              </button>
            </form>
          `;
        }
        return;
      }

      if (roomData.phase === "showdown") {
        const subs = roomData.finalSubmissions || {};
        const childIds = playerIds.filter(pid => pid !== roomData.parentId);
        const submittedCount = childIds.filter(pid => subs[pid]).length;

        if (isParent) {
          if (childIds.length > 0 && submittedCount >= childIds.length) {
            bottom.innerHTML = `
              <div class="space-y-2 animate-pop">
                <p class="text-xs font-black text-center text-rose-600">🎉 全員提出完了！基準に一番近い「優勝」をタップ！</p>
                <div class="grid grid-cols-1 gap-2 max-h-44 overflow-y-auto">
                  ${childIds.map(pid => {
                    const s = subs[pid];
                    return `
                      <button onclick="selectShowdownWinner('${pid}')" class="flex items-center justify-between bg-amber-50 hover:bg-amber-200 border-2 border-amber-400 px-4 py-2.5 rounded-xl font-black text-left transition">
                        <span class="text-base text-slate-900">${escapeHtml(s.text)}</span>
                        <span class="text-xs text-slate-500">${escapeHtml(s.name)}</span>
                      </button>
                    `;
                  }).join("")}
                </div>
              </div>
            `;
          } else {
            bottom.innerHTML = `
              <div class="space-y-2 text-center">
                <p class="text-xs font-bold text-slate-600">⏳ 子の最終ワード提出待ち（${submittedCount} / ${childIds.length}人完了）</p>
              </div>
            `;
          }
        } else {
          if (subs[myId]) {
            bottom.innerHTML = `
              <div class="text-center py-2.5 bg-indigo-50 rounded-xl border border-indigo-200">
                <p class="text-xs font-bold text-indigo-800">✅ 提出完了：「${escapeHtml(subs[myId].text)}」</p>
                <p class="text-[11px] text-slate-500 mt-0.5">他のメンバーの提出を待っています（${submittedCount}/${childIds.length}人）</p>
              </div>
            `;
          } else {
            bottom.innerHTML = `
              <form onsubmit="event.preventDefault(); submitFinalWord();" class="space-y-1.5">
                <p class="text-[11px] font-black text-rose-600">🔥 決戦！これが1位になると思うワードを1つ送信！</p>
                <div class="flex gap-2">
                  <input id="final-input" type="text" maxlength="25" placeholder="最終回答を入力..."
                    class="flex-1 px-4 py-3 rounded-xl border-2 border-rose-400 focus:outline-none font-bold text-base select-text" />
                  <button type="submit" class="bg-rose-500 hover:bg-rose-600 text-white font-black px-5 py-3 rounded-xl shadow transition shrink-0">
                    決定！
                  </button>
                </div>
              </form>
            `;
          }
        }
        return;
      }

      if (roomData.phase === "reveal") {
        if (isParent) {
          bottom.innerHTML = `
            <button onclick="revealCriterion()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-[0.99] text-white font-black py-3.5 rounded-2xl shadow-md transition text-base">
              👀 チャット全員に「基準」を公開する！
            </button>
          `;
        } else {
          bottom.innerHTML = `
            <div class="text-center py-3 text-xs font-bold text-slate-600">
              🥁 親が「基準」を公開するのを待っています…！
            </div>
          `;
        }
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
